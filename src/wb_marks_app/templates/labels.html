{% extends "layout.html" %}
{% block content %}
<style>
  .label-template-page {
    max-width: 1280px;
    margin: 0 auto;
  }
  .label-template-page h1 {
    margin-bottom: 24px;
  }
  .template-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 42px;
    align-items: start;
  }
  .template-option {
    display: grid;
    gap: 18px;
    align-content: start;
    cursor: pointer;
  }
  .template-option input {
    width: 30px;
    height: 30px;
    margin: 0;
    accent-color: #111;
    cursor: pointer;
  }
  .template-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 40px;
  }
  .template-name {
    font-size: 28px;
    line-height: 34px;
  }
  .template-preview {
    display: block;
    width: 100%;
    max-width: 320px;
    height: auto;
  }
  @media (max-width: 980px) {
    .template-grid {
      grid-template-columns: repeat(2, minmax(220px, 1fr));
    }
  }
  @media (max-width: 620px) {
    .template-grid {
      grid-template-columns: 1fr;
      gap: 30px;
    }
    .template-name {
      font-size: 24px;
      line-height: 30px;
    }
  }
</style>

<div class="label-template-page">
  <h1>Этикетки</h1>
  {% if message %}<p class="error">{{ message }}</p>{% endif %}
  <div class="template-grid" role="list">
    <label class="template-option" role="listitem">
      <span class="template-heading">
        <input type="checkbox" name="template" value="srad" checked aria-label="SRad" />
        <span class="template-name">SRad</span>
      </span>
      <img class="template-preview" src="/static/label_assets/template_srad.png" alt="SRad" />
    </label>
    <label class="template-option" role="listitem">
      <span class="template-heading">
        <input type="checkbox" name="template" value="simple" aria-label="Simple" />
        <span class="template-name">Simple</span>
      </span>
      <img class="template-preview" src="/static/label_assets/template_simple.png" alt="Simple" />
    </label>
    <label class="template-option" role="listitem">
      <span class="template-heading">
        <input type="checkbox" name="template" value="simple_brand" aria-label="SIMPLE Brand" />
        <span class="template-name">SIMPLE Brand</span>
      </span>
      <img class="template-preview" src="/static/label_assets/template_simple_brand.png" alt="SIMPLE Brand" />
    </label>
    <label class="template-option" role="listitem">
      <span class="template-heading">
        <input type="checkbox" name="template" value="medium" aria-label="Medium" />
        <span class="template-name">Medium</span>
      </span>
      <img class="template-preview" src="/static/label_assets/template_medium.png" alt="Medium" />
    </label>
  </div>
</div>

<script>
  const templateInputs = Array.from(document.querySelectorAll('input[name="template"]'));
  const storedTemplate = localStorage.getItem("labelTemplate");
  const initialInput = templateInputs.find((input) => input.value === storedTemplate);
  if (initialInput) {
    templateInputs.forEach((input) => { input.checked = input === initialInput; });
  }
  templateInputs.forEach((input) => {
    input.addEventListener("change", () => {
      if (!input.checked) {
        input.checked = true;
        return;
      }
      templateInputs.forEach((other) => { if (other !== input) other.checked = false; });
      localStorage.setItem("labelTemplate", input.value);
    });
  });
</script>
{% endblock %}
