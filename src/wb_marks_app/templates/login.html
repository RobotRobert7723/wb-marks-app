{% extends "layout.html" %}
{% block content %}
<div class="card form-card">
  <h1>Вход</h1>
  {% if message %}<p class="error">{{ message }}</p>{% endif %}
  <form method="post" action="/login">
    <div>
      <label>Логин</label>
      <input type="text" name="login" value="{{ login }}" autocomplete="username" />
    </div>
    <div style="margin-top: 16px;">
      <label>Пароль</label>
      <input type="password" name="password" autocomplete="current-password" />
    </div>
    <div class="actions" style="margin-top: 16px;">
      <button type="submit">Войти</button>
      <a class="button secondary" href="/register">Регистрация</a>
    </div>
    <p style="margin-top: 16px;"><a href="/forgot-password">Забыли пароль?</a></p>
  </form>
</div>
{% endblock %}
