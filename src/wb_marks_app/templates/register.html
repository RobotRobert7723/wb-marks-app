{% extends "layout.html" %}
{% block content %}
<div class="card form-card">
  <h1>Регистрация</h1>
  {% if message %}<p class="error">{{ message }}</p>{% endif %}
  <form method="post" action="/register">
    <div>
      <label>Email</label>
      <input type="email" name="email" value="{{ form.email }}" autocomplete="email" />
    </div>
    <div style="margin-top: 16px;">
      <label>Логин</label>
      <input type="text" name="login" value="{{ form.login }}" autocomplete="username" />
    </div>
    <div style="margin-top: 16px;">
      <label>Пароль</label>
      <input type="password" name="password" autocomplete="new-password" />
    </div>
    <div style="margin-top: 16px;">
      <label>Повторите пароль</label>
      <input type="password" name="password_confirm" autocomplete="new-password" />
    </div>
    <div class="actions" style="margin-top: 16px;">
      <button type="submit">Создать пользователя</button>
      <a class="button secondary" href="/login">Уже есть аккаунт</a>
    </div>
  </form>
</div>
{% endblock %}
