{% extends "layout.html" %}
{% block content %}
<div class="card form-card">
  <h1>Сброс пароля</h1>
  {% if message %}
  <p class="{% if 'sent' in message %}muted{% else %}error{% endif %}">{{ message }}</p>
  {% endif %}
  <form method="post" action="/forgot-password">
    <div>
      <label>Email</label>
      <input type="email" name="email" value="{{ form.email }}" autocomplete="email" />
    </div>
    <div style="margin-top: 16px;">
      <label>Логин</label>
      <input type="text" name="login" value="{{ form.login }}" autocomplete="username" />
    </div>
    <div class="actions" style="margin-top: 16px;">
      <button type="submit">Отправить ссылку</button>
      <a class="button secondary" href="/login">Назад ко входу</a>
    </div>
  </form>
</div>
{% endblock %}
